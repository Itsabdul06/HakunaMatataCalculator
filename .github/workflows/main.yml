name: Build Fire Suppression Quote Wizard EXE
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options:
          - debug
          - release
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Report Tcl/Tk version (diagnostic)
      shell: pwsh
      run: |
        python -c "import tkinter; r = tkinter.Tk(); print('Tcl/Tk version:', r.tk.call('info', 'patchlevel')); r.destroy()"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install xlwings
        pip install pywin32

    - name: Build executable
      shell: pwsh
      run: |
        pyinstaller --onedir `
          --name="Fire_Suppression_Quote_Wizard" `
          --hidden-import=xlwings `
          --hidden-import=win32com `
          --hidden-import=win32api `
          --hidden-import=win32con `
          --hidden-import=win32com.client `
          --collect-all=xlwings `
          quote_wizard.py

    - name: Verify build
      run: |
        echo "Build completed. Checking for executable..."
        if (Test-Path "dist\Fire_Suppression_Quote_Wizard\Fire_Suppression_Quote_Wizard.exe") {
          echo "Executable created successfully!"
          dir dist\Fire_Suppression_Quote_Wizard\
        } else {
          echo "Executable not found!"
          exit 1
        }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Fire_Suppression_Quote_Wizard_Windows
        path: dist\Fire_Suppression_Quote_Wizard\
        retention-days: 30

    - name: Upload debug info (if build fails)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-debug-info
        path: |
          build\
          *.spec
        retention-days: 7
